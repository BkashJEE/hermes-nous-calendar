</head><body><div id="root"></div>
<noscript>Hermes Daily Drops needs JavaScript. The same calendar ships as a Hermes Desktop plugin: github.com/BkashJEE/hermes-nous-calendar</noscript>
<script type="module">
import { createRoot } from 'react-dom/client'
import plugin from './plugin.js'
import { restCall } from './sdk-shim.js'
const reg = []
const ctx = { web: true, rest: restCall, os: null, register: (c) => { reg.push(c); return () => {} },
  setInterval: (f, ms) => { const t = setInterval(f, ms); return () => clearInterval(t) },
  addEventListener: (t, e, f) => { t.addEventListener(e, f); return () => t.removeEventListener(e, f) } }
plugin.register(ctx)
createRoot(document.getElementById('root')).render(reg.find((c) => c.area === 'routes').render())
</script></body></html>
